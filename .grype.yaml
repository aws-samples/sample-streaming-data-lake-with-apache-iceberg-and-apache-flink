      name: jackson-datatype-jsr310

  # hadoop-common: We use 3.4.0 (parent pom.xml).
  # These CVEs have fix versions 2.10.2 and 2.8.1 — far below our 3.4.0.
  # Grype flags them because it can't resolve the effective Maven version from pom.xml.
  - vulnerability: GHSA-rmpj-7c96-mrg8
    package:
      name: hadoop-common
  - vulnerability: GHSA-gx2c-fvhc-ph4j
    package:
      name: hadoop-common

